name: youtube_player_iframe_example
description: Demonstrates how to use the youtube_player_iframe plugin.
publish_to: none
version: 25.4.6+5

environment:
  sdk: '>=2.17.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
      sdk: flutter
  youtube_player_iframe: ^5.2.0
  go_router: ^14.2.3
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_auth_web: ^5.13.2
  google_sign_in: ^6.1.6
  cloud_firestore: ^5.4.4
  firestore_cache: ^2.14.8
  intl: ^0.19.0
  flutter_quill: ^10.8.5
  rxdart: ^0.27.7
  irondash_engine_context: ^0.5.4

  flutter_colorpicker: ^1.1.0
  device_info_plus: ^10.1.2
  image_picker_for_web: ^3.0.6
  super_native_extensions: ^0.8.24
  video_player_web: ^2.3.3

  flutter_inappwebview: ^6.1.5
  pointer_interceptor: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/ladybug_logo_removebg.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/ladybug_logo_removebg.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/ladybug_logo_removebg.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/ladybug_logo_removebg.png"

flutter:
  uses-material-design: true
  assets:
    - assets/google_logo.png
    - assets/ladybug_logo_removebg.png
