name: youtube_player_iframe_example
description: Demonstrates how to use the youtube_player_iframe plugin.
publish_to: none
version: 4.0.3

environment:
  sdk: '>=2.17.0 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
      sdk: flutter
  youtube_player_iframe: ^5.2.0
  go_router: ^14.2.3
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_auth_web: ^5.13.2
  google_sign_in: ^6.1.6
  cloud_firestore: ^5.4.4
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  flutter_quill: ^10.8.5

  flutter_colorpicker: ^1.1.0
  device_info_plus: ^10.0.1
  image_picker_for_web: ^3.0.6
  super_native_extensions: ^0.8.24
  video_player_web: ^2.3.3
  irondash_engine_context: ^0.5.4


dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/google_logo.png
