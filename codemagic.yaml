workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m1
    max_build_duration: 120
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yourdomain.youtubeplayer # Thay đổi theo bundle ID của bạn
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - ~/.pub-cache
        - $FLUTTER_ROOT/.pub-cache
        - $FCI_BUILD_DIR/build
    scripts:
      - name: Set up code signing settings on Xcode project
        script: | 
          xcode-project use-profiles
      - name: Install dependencies
        script: | 
          flutter pub get
      - name: Install pods
        script: | 
          find . -name "Podfile" -execdir pod install \;
      - name: Flutter build ipa
        script: | 
          flutter build ipa --release \
            --build-name=$(($BUILD_NUMBER)) \
            --build-number=$(($BUILD_NUMBER)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - your.email@example.com # Thay đổi email của bạn
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        # Các giá trị key được định cấu hình trong cài đặt dự án CodeMagic
        # Bạn cần tạo App Store Connect API key và cung cấp nó cho CodeMagic
        submit_to_testflight: true
        submit_to_app_store: false 