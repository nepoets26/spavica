workflows:
  flutter-ios-workflow:
    name: Flutter iOS Build
    max_build_duration: 120
    environment:
      flutter: stable # Hoặc phiên bản Flutter cụ thể, ví dụ: 3.10.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Flutter dependencies
        script: |
          flutter pub get
      - name: Build iOS IPA
        script: |
          flutter build ipa --release
    artifacts:
      - build/ios/iphoneos/*.ipa
    publishing:
      email:
        recipients:
          - ghostsoul26@gmail.com # Thay bằng email của bạn